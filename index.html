<body>
  <article class="chat-container">
    <header class="chat-header">
      <h1 class="text-lg font-semibold" data-translation-key="chatTitle">Chatbot AI</h1>
      <nav class="settings-menu">
        <button id="settingsMenuButton" class="theme-toggle-button" title="Cài đặt">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </button>
        <div id="settingsDropdown" class="dropdown-menu hidden">
          <button id="menuThemeToggle">
            <div class="icon-container">
              <svg id="menuThemeIconLight" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg id="menuThemeIconDark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="hidden">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </div>
            <span data-translation-key="menuChangeTheme">Đổi giao diện</span>
          </button>
          <button id="menuApiKey">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon-container">
              <path
                d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
            </svg>
            <span data-translation-key="menuSetApiKey">Nhập API Key</span>
          </button>
          <button id="menuLanguageToggle">
            <span class="icon-container" aria-hidden="true">🌐</span>
            <span data-translation-key="menuLanguage">Ngôn ngữ:</span>&nbsp;<strong
              id="menuLanguageIndicator">VI</strong>
          </button>
        </div>
      </nav>
    </header>
    <main class="chat-messages" id="chatMessages">
    </main>
    <footer class="chat-input-area">
      <div class="chat-input-main">
        <!-- Nút đính kèm ảnh -->
        <button id="attachButton" class="attach-button" aria-label="Đính kèm hình ảnh">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden" style="display: none;">

        <div id="chatInputWrapper" class="chat-input-wrapper">
          <!-- Vùng xem trước ảnh (Image Preview) -->
          <div id="imagePreviewContainer" class="image-preview-container hidden">
            <div class="image-preview-wrapper">
              <img id="imagePreview" src="" alt="Selected Preview">
              <button id="clearImageButton" class="clear-image-button" aria-label="Xóa ảnh">×</button>
            </div>
          </div>

          <textarea id="chatInput" class="chat-input" placeholder="Nhắn tin cho AI..."
            data-translation-key="chatInputPlaceholder" autocomplete="off" rows="1"></textarea>
          <div id="charCounter" class="char-counter">0/2000</div>
        </div>

        <button id="stopGeneratingButton" class="send-button hidden" aria-label="Ngừng trả lời">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
        </button>
        <button id="sendButton" class="send-button" aria-label="Gửi tin nhắn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>

      <!-- Google Search Toggle -->
      <div class="chat-input-controls">
        <button id="toggleSearchBtn" class="control-pill" aria-label="Toggle Google Search">
          <span class="pill-icon">🌐</span>
          <span data-translation-key="toggleGoogleSearch">Google Search</span>
        </button>
      </div>

      <div id="inputErrorMessage" class="input-error-message" role="alert" style="display: none;"></div>
    </footer>
  </article>

  <!-- Modal API Key -->
  <div id="apiKeyModal"
    class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center hidden"
    style="pointer-events: none; z-index: 1050;" role="dialog" aria-modal="true" aria-labelledby="apiKeyModalTitle">
    <div class="modal-content-box">
      <button id="closeApiKeyModalButton" class="modal-close-button" aria-label="Đóng modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <h2 id="apiKeyModalTitle" class="text-2xl font-semibold mb-4" data-translation-key="apiKeyModalTitle">Nhập API Key của Google AI</h2>
      <p class="mb-6 text-sm" data-translation-key="apiKeyModalDescription">
        Để sử dụng chatbot, bạn cần cung cấp API Key. Bạn có thể lấy API Key từ Google AI Studio.
      </p>

      <!-- Nhập API Key -->
      <div class="mb-6">
        <label for="apiKeyInput" class="block text-sm font-semibold mb-2" data-translation-key="apiKeyModalInputPlaceholder">API Key của bạn</label>
        <input type="password" id="apiKeyInput" class="w-full p-3 border border-gray-300 rounded-md"
          placeholder="API Key của bạn" data-translation-key="apiKeyModalInputPlaceholder">
      </div>

      <div class="flex justify-end">
        <button id="saveApiKeyButton" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 font-medium"
          data-translation-key="apiKeyModalSaveButton">Lưu Key</button>
      </div>
    </div>
  </div>
